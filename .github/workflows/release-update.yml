# Build web app + Android APK, publish to GitHub Releases & Pages.
#
# Download the app:
#   https://github.com/thelubemaster/Receipt-tracker/releases/latest/download/schoolie.apk
#
# One-time: Settings → Pages → Source: GitHub Actions
name: Release app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-release
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Pack OTA zip + install/update manifests
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/downloads
          # Never ship multi-MB APK on Pages — Releases host schoolie.apk
          rm -f dist/downloads/schoolie.apk
          (
            cd dist
            rm -f downloads/web-update.zip
            # Never embed downloads/ (APK, install zips) inside the OTA bundle
            zip -qr downloads/web-update.zip . \
              -x 'downloads/*' \
              -x 'downloads/**'
          )
          REPO="https://github.com/thelubemaster/Receipt-tracker"
          # Prefer Releases assets (Pages may be disabled). App also reads Releases API.
          APK="${REPO}/releases/latest/download/schoolie.apk"
          WEB="${REPO}/releases/latest/download/web-update.zip"
          printf '%s\n' "{
            \"version\": \"${V}\",
            \"url\": \"${WEB}\",
            \"notes\": \"Schoolie v${V} — free on-device scan update\",
            \"apkVersion\": \"${V}\",
            \"apkUrl\": \"${APK}\"
          }" > dist/app-update.json
          printf '%s\n' "{
            \"baseUrl\": \"${REPO}/releases/latest/download\",
            \"version\": \"${V}\",
            \"source\": \"github-releases\",
            \"updatedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }" > dist/update-server.json
          printf '%s\n' "{
            \"version\": \"${V}\",
            \"name\": \"Schoolie Cost Tracker\",
            \"apkUrl\": \"${APK}\",
            \"apkFileName\": \"schoolie.apk\",
            \"releasesUrl\": \"${REPO}/releases/latest\",
            \"repoUrl\": \"${REPO}\",
            \"notes\": \"Download schoolie.apk, open it, tap Install.\"
          }" > dist/install.json
          node -e "const fs=require('fs');const p='dist/version.json';let j={version:process.env.V,name:'schoolie-tracker',builtAt:new Date().toISOString()};try{Object.assign(j,JSON.parse(fs.readFileSync(p,'utf8')))}catch{};j.version=process.env.V;fs.writeFileSync(p,JSON.stringify(j,null,2))"
          ls -lh dist/downloads/web-update.zip dist/app-update.json dist/install.json

      - uses: actions/upload-artifact@v4
        with:
          name: schoolie-dist
          path: dist
          retention-days: 7

  apk:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage schoolie.apk
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/schoolie.apk
          ls -lh artifacts/schoolie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: schoolie-apk
          path: artifacts/schoolie.apk
          retention-days: 14
          if-no-files-found: error

  # Pages is optional — many installs only use GitHub Releases for OTA.
  pages:
    needs: web
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schoolie-dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  # Publish OTA even when the APK job fails (content updates do not need a new shell).
  release:
    needs: [web, apk]
    if: ${{ always() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schoolie-dist
          path: dist

      - name: Download APK artifact if present
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: schoolie-apk
          path: artifacts

      - name: Publish GitHub Release (OTA zip + APK when available)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.web.outputs.version }}
          name: Schoolie v${{ needs.web.outputs.version }}
          body: |
            ## Download the Android app

            **[⬇ Download schoolie.apk](https://github.com/thelubemaster/Receipt-tracker/releases/latest/download/schoolie.apk)**

            1. Open the file on your phone  
            2. Allow **Install unknown apps** if asked  
            3. Tap **Install** → **Open**

            After install, later updates can arrive as a small web bundle (no full re-download) when you open the app on Wi‑Fi / mobile data.

            ---
            Also included: `web-update.zip` (OTA for already-installed APKs).
          files: |
            dist/downloads/web-update.zip
            dist/app-update.json
            dist/install.json
            artifacts/schoolie.apk
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
